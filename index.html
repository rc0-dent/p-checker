<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポイ活還元計算機</title>
<style>
/* 背景を明るいブルーのグラデーションに */
body {
font-family: 'Helvetica Neue', Arial, sans-serif;
text-align: center;
padding: 20px;
margin: 0;
background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

/* 白いふわっとしたカード */
.card {
background: rgba(255, 255, 255, 0.95);
padding: 30px;
border-radius: 30px;
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
max-width: 380px;
width: 100%;
}

h2 { color: #333; margin-top: 0; font-size: 1.5rem; }
p { color: #777; font-size: 0.9rem; }

/* 入力エリアを明るく */
input {
width: 85%;
padding: 15px;
font-size: 1.8rem;
margin: 20px 0;
border: 2px solid #e0e0e0;
border-radius: 15px;
text-align: center;
outline: none;
color: #007bff;
background: #fdfdfd;
}
input:focus { border-color: #74ebd5; }

/* 結果表示ボックス */
.result-box {
background: #f0faff;
padding: 20px;
border-radius: 20px;
margin-bottom: 25px;
}
.result-label { font-size: 0.8rem; color: #55a; margin-bottom: 5px; }
.result-amount { font-size: 2.2rem; color: #ff6b6b; font-weight: bold; }

/* ボタンのデザイン */
.btn-group { display: flex; flex-direction: column; gap: 15px; }
.btn {
padding: 18px;
border: none;
border-radius: 50px; /* 丸いボタン */
color: white;
font-weight: bold;
cursor: pointer;
text-decoration: none;
display: block;
font-size: 1.1rem;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
transition: 0.3s;
}
.btn:active { transform: translateY(2px); box-shadow: none; }

/* 各種カラー */
.rakuten { background: #ff4747; } /* 明るめの赤 */
.smbc { background: #2ecc71; } /* 明るめの緑 */
.dcard { background: #f1c40f; } /* 明るめの黄 */
</style>
</head>
<body>

<div class="card">
<h2>ポイ活還元計算機</h2>
<p>いくらお買い物する？</p>

<input type="number" id="amount" placeholder="0" oninput="calculate()">

<div class="result-box">
<div class="result-label">もらえるポイント(1%換算)</div>
<div class="result-amount" id="result">0 <small style="font-size: 1rem;">円分</small></div>
</div>

<div class="btn-group">
<a href="https://rpx.a8.net/svt/ejp?a8mat=4AXE4J+F171O2+2HOM+699KH&rakuten=y&a8ejpredirect=http%3A%2F%2Fhb.afl.rakuten.co.jp%2Fhgc%2F0ea62065.34400275.0ea62066.204f04c0%2Fa26021880808_4AXE4J_F171O2_2HOM_699KH%3Fpc%3Dhttp%253A%252F%252Fwww.rakuten.co.jp%252F%26m%3Dhttp%253A%252F%252Fm.rakuten.co.jp%252F"
target="_blank" class="btn rakuten">楽天カードで貯める</a>

<a href="https://www.smbc-card.com/" target="_blank" class="btn smbc">三井住友カード</a>
<a href="https://dcard.docomo.ne.jp/" target="_blank" class="btn dcard">dカード</a>
</div>
</div>

<script>
function calculate() {
const val = document.getElementById('amount').value || 0;
const points = Math.floor(val * 0.01);
document.getElementById('result').innerHTML = `${points.toLocaleString()} <small style="font-size: 1rem;">円分</small>`;
}
</script>

</body>
</html>
