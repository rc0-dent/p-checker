<title>P-checker Pro | 全カード一覧・保存機能付</title>
<style>
body { background-color: #ffffff; font-family: sans-serif; color: #000; margin: 0; padding: 10px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 900px; } /* 一覧を見やすくするため少し広く設定 */
.header { font-size: 38px; font-weight: 900; text-align: center; margin-bottom: 5px; }
.sub-header { text-align: center; font-size: 12px; font-weight: 900; color: #333; margin-bottom: 20px; }

/* 入力エリア */
.input-section { max-width: 500px; margin: 0 auto 20px; background: #f8f9fa; padding: 20px; border-radius: 20px; border: 3px solid #000; }
.label-main { font-size: 14px; font-weight: 900; margin-bottom: 8px; display: block; text-align: center; }
.price-input { background: transparent; border: none; border-bottom: 4px solid #000; color: #000; font-size: 42px; font-weight: 900; width: 100%; outline: none; text-align: center; }

.sort-ctrl { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
.sort-btn { background: #fff; border: 2px solid #000; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 900; cursor: pointer; }
.sort-btn.active { background: #000; color: #fff; }

/* 比較スロット */
.reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; max-width: 500px; margin-left: auto; margin-right: auto; }
.reward-item { background: #fff; padding: 15px 10px; border-radius: 20px; border: 2px solid #000; text-align: center; transition: 0.3s; }
.reward-item.best { border-color: #00b894; background-color: #f0fff4; box-shadow: 0 0 25px rgba(0, 184, 148, 0.4); transform: translateY(-3px); }

.name-input { width: 95%; border: none; border-bottom: 2px solid #333; font-size: 14px; font-weight: 900; text-align: center; margin-bottom: 12px; outline: none; }
.setting-group { display: flex; flex-direction: column; gap: 8px; }
.setting-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; }
.guide-text { color: #00b894; }
.mini-input { background: #fff; border: 2px solid #000; border-radius: 10px; font-size: 16px; font-weight: 900; padding: 8px; text-align: center; outline: none; }

.res-box { margin-top: 15px; border-top: 2px solid #000; padding-top: 10px; }
.reward-amount { font-size: 26px; font-weight: 900; }

/* ★ここが「使える会社一覧」セクション */
.all-list-section { margin-top: 40px; border: 3px solid #000; border-radius: 20px; padding: 20px; background: #fff; margin-bottom: 30px; }
.all-list-title { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 20px; background: #000; color: #fff; padding: 10px; border-radius: 15px; }

/* 10列並べるための設定 */
.all-list-grid {
display: grid;
grid-template-columns: repeat(10, 1fr); /* PCで10列 */
gap: 5px;
}
@media (max-width: 850px) { .all-list-grid { grid-template-columns: repeat(5, 1fr); } } /* タブレットで5列 */
@media (max-width: 500px) { .all-list-grid { grid-template-columns: repeat(3, 1fr); } } /* スマホで3列 */

.list-card-name {
font-size: 9px;
font-weight: 900;
padding: 10px 2px;
border: 1px solid #000;
border-radius: 8px;
text-align: center;
cursor: pointer;
background: #fff;
display: flex;
align-items: center;
justify-content: center;
line-height: 1.2;
height: 40px;
}
.list-card-name:hover { background: #00b894; color: #fff; }

.btn-rakuten { display: block; background-color: #bf0000; color: #fff; padding: 20px; border-radius: 15px; font-weight: 900; text-decoration: none; text-align: center; margin: 30px auto; max-width: 500px; font-size: 18px; }
.text-section { background: #fff; padding: 25px; border-radius: 20px; border-left: 8px solid #00b894; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 40px; }
.legal-section { font-size: 13px; color: #333; border-top: 2px solid #000; padding-top: 30px; margin-bottom: 80px; }

<div class="input-section">

<input type="number" id="price" class="price-input" value="10000" oninput="updateAll()">
</div>

<div class="sort-ctrl">
<div id="btn-pop" class="sort-btn active" onclick="changeSort('pop')">人気順</div>

<div class="all-list-grid" id="full-list-display"></div>
</div>

<div class="text-section">

<p>「P-checker」は、日本の複雑なキャッシュレス還元を一目で比較するために開発されました。100種類以上の主要な決済データを網羅。ブラウザへの保存機能により、あなただけの比較セットをいつでも呼び出せます。</p>
</div>

</div>
</div>

"Oliveデビット": {r: 0.5, l: "", k: "お"}, "三菱UFJデビット": {r: 0.2, l: "", k: "み"}, "みずほデビット": {r: 0.5, l: "", k: "み"}, "ゆうちょデビット": {r: 0.2, l: "", k: "ゆ"},
"ルミネカード": {r: 1.0, l: "", k: "る"}, "エネオスカード": {r: 0.6, l: "", k: "え"}, "アポロステーション": {r: 0.5, l: "", k: "あ"}, "マツキヨカード": {r: 1.0, l: "", k: "ま"},

"三井住友ビジネス": {r: 0.5, l: "", k: "み"}, "セゾンプラチナ": {r: 1.25, l: "", k: "せ"}, "リクルート(プラス)": {r: 2.0, l: "", k: "り"}, "JQ CARDエポス": {r: 0.5, l: "", k: "し"},
"J-Coin Pay": {r: 0.0, l: "", k: "し"}, "ゆうちょPay": {r: 0.5, l: "", k: "ゆ"}, "楽天Edy": {r: 0.5, l: "", k: "ら"}, "スターバックスカード": {r: 0.0, l: "", k: "す"},
"ドトールバリュー": {r: 1.0, l: "", k: "と"}, "シェルPonta": {r: 1.0, l: "", k: "し"}, "コスモザカード": {r: 0.0, l: "", k: "こ"}, "あおぞらデビット": {r: 1.0, l: "", k: "あ"},
"GMOあおぞらデビット": {r: 0.6, l: "", k: "し"}, "セブン銀行デビット": {r: 0.5, l: "", k: "せ"}, "PayPay銀行デビット": {r: 0.5, l: "", k: "へ"}, "イオン銀行デビット": {r: 0.5, l: "", k: "い"},
"りそなデビット": {r: 0.5, l: "", k: "り"}, "スルガ銀行デビット": {r: 0.2, l: "", k: "す"}, "住信SBI(マスター)": {r: 0.8, l: "", k: "す"}
};

const defaultNames = ["楽天カード", "三井住友(タッチ)", "PayPayカード", "dカード", "au PAY カード", "Amazonプライム"];

function saveNames() {
let names = [];
for(let i=1; i<=6; i++) names.push(document.getElementById('name' + i).value);
localStorage.setItem('pchecker_names', JSON.stringify(names));
}

function loadNames() {
const saved = localStorage.getItem('pchecker_names');
return saved ? JSON.parse(saved) : defaultNames;
}

function changeSort(type) {
document.getElementById('btn-pop').classList.toggle('active', type === 'pop');
document.getElementById('btn-kana').classList.toggle('active', type === 'kana');
renderContents(type);
}

function renderContents(type) {
const datalist = document.getElementById('service-list');
const fullListDiv = document.getElementById('full-list-display');
datalist.innerHTML = ""; fullListDiv.innerHTML = "";
let keys = Object.keys(db);
if (type === 'kana') keys.sort((a, b) => db[a].k.localeCompare(db[b].k, 'ja'));
keys.forEach(k => {
const opt = document.createElement('option'); opt.value = k; datalist.appendChild(opt);
const cardItem = document.createElement('div');
cardItem.className = 'list-card-name'; cardItem.innerText = k;
cardItem.onclick = () => fillFromList(k); fullListDiv.appendChild(cardItem);
});
}

function fillFromList(name) {
for(let i=1; i<=6; i++) {
let current = document.getElementById('name' + i).value;
if (current === "" || !db[current]) {
document.getElementById('name' + i).value = name;
checkAndFill(i); return;
}
}
document.getElementById('name' + 1).value = name;
checkAndFill(1);
}

const grid = document.getElementById('grid');
const initialNames = loadNames();
for (let i = 1; i <= 6; i++) {
grid.innerHTML += `
<div class="reward-item" id="item${i}">
<input type="text" id="name${i}" class="name-input" list="service-list" value="${initialNames[i-1] || ''}" oninput="checkAndFill(${i})">
<div class="setting-group">
<div class="setting-header">還元率 %<span id="g-r${i}" class="guide-text"></span></div>
<input type="number" id="rate${i}" class="mini-input" step="0.5" oninput="updateAll()">
<div class="setting-header">上限 pt<span id="g-l${i}" class="guide-text"></span></div>
<input type="number" id="limit${i}" class="mini-input" placeholder="無" oninput="updateAll()">
</div>
<div class="res-box"><div class="reward-amount"><span id="val${i}">0</span><span class="unit">pt</span></div></div>
</div>
`;
}

function checkAndFill(idx) {
const name = document.getElementById('name' + idx).value;
const data = db[name];
if (data) {
document.getElementById('rate' + idx).value = data.r;
document.getElementById('limit' + idx).value = data.l;
document.getElementById('g-r' + idx).innerText = "※" + data.r + "%";
document.getElementById('g-l' + idx).innerText = data.l ? "上限:" + data.l : "";
}
saveNames(); updateAll();
}

function updateAll() {
const p = parseFloat(document.getElementById('price').value) || 0;
let results = [];
for (let i = 1; i <= 6; i++) {
const r = parseFloat(document.getElementById('rate' + i).value) || 0;
const limVal = document.getElementById('limit' + i).value;
const l = limVal === "" ? Infinity : parseFloat(limVal);
const res = Math.floor(Math.min(p * (r / 100), l));
document.getElementById('val' + i).innerText = res.toLocaleString();
results.push({ index: i, val: res });
document.getElementById('item' + i).classList.remove('best');
}
const maxVal = Math.max(...results.map(r => r.val));
if (maxVal > 0) {
results.filter(r => r.val === maxVal).forEach(b => document.getElementById('item' + b.index).classList.add('best'));
}
}

renderContents('pop');
for(let i=1; i<=6; i++) { checkAndFill(i); }
</script>
