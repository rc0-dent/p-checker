<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-Checker PRO</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { margin: 0; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#root { min-height: 100vh; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// UI部品のシミュレーション
const View = ({ style, ...props }) => <div style={{ display: 'flex', flexDirection: 'column', position: 'relative', boxSizing: 'border-box', ...style }} {...props} />;
const Text = ({ style, ...props }) => <span style={{ display: 'inline-block', ...style }} {...props} />;
const TextInput = ({ style, value, onChangeText, ...props }) => (
<input
style={{ background: 'transparent', border: 'none', outline: 'none', color: 'inherit', font: 'inherit', width: '100%', ...style }}
value={value}
onChange={(e) => onChangeText(e.target.value)}
{...props}
/>
);
const ScrollView = ({ contentContainerStyle, style, ...props }) => <div style={{ overflowY: 'auto', flex: 1, ...style, ...contentContainerStyle }} {...props} />;
const SafeAreaView = ({ style, ...props }) => <div style={{ flex: 1, display: 'flex', flexDirection: 'column', ...style }} {...props} />;
const TouchableOpacity = ({ style, onPress, ...props }) => <div style={{ cursor: 'pointer', ...style }} onClick={onPress} {...props} />;
const StyleSheet = { create: (styles) => styles };
const Linking = { openURL: (url) => window.open(url, '_blank') };
const AsyncStorage = {
getItem: async (key) => localStorage.getItem(key),
setItem: async (key, val) => localStorage.setItem(key, val)
};

// ここから下に「完全版コード」の中身を貼り付け

const AD_URLS = {
'楽天ペイ等': 'https://www.rakuten-card.co.jp/',
'三井住友NL': 'https://www.smbc-card.com/',
'J-Coin': 'https://j-coin.jp/',
'default': 'https://www.google.com'
};

function App() {
const [price, setPrice] = useState('10000');
const [cards, setCards] = useState([
{ id: 1, name: 'PayPay等', rate: '0.5', limit: '' },
{ id: 2, name: '楽天ペイ等', rate: '1.5', limit: '' },
{ id: 3, name: 'd払い等', rate: '0.5', limit: '' },
{ id: 4, name: '三井住友NL', rate: '7.0', limit: '1000' },
{ id: 5, name: 'J-Coin', rate: '10.0', limit: '500' },
{ id: 6, name: '案6', rate: '0.0', limit: '' },
]);

useEffect(() => {
const loadData = async () => {
try {
const saved = await AsyncStorage.getItem('@p_checker_data_v1');
if (saved !== null) setCards(JSON.parse(saved));
} catch (e) { console.error(e); }
};
loadData();
}, []);

const updateCard = async (id, field, value) => {
const newCards = cards.map(c => c.id === id ? { ...c, [field]: value } : c);
setCards(newCards);
await AsyncStorage.setItem('@p_checker_data_v1', JSON.stringify(newCards));
};

const calcPt = (p, r, l) => {
const numP = parseFloat(p) || 0;
const numR = parseFloat(r) || 0;
const numL = l === '' ? Infinity : parseFloat(l);
return Math.min(numP * (numR / 100), numL);
};

const results = cards.map(c => calcPt(price, c.rate, c.limit));
const maxPt = Math.max(...results);
const winnerIndex = results.indexOf(maxPt);
const winnerName = maxPt > 0 ? cards[winnerIndex].name : null;

return (
<SafeAreaView style={styles.container}>
<View style={styles.fixedHeader}><Text style={styles.headerTitle}>P-Checker PRO</Text></View>
<ScrollView contentContainerStyle={styles.scroll}>
<View style={styles.priceSection}>
<Text style={styles.label}>買い物金額</Text>
<View style={styles.priceInputWrapper}>
<TextInput style={styles.priceInput} value={price} onChangeText={setPrice} />
<Text style={styles.yenText}>円</Text>
</View>
</View>
{winnerName && (
<TouchableOpacity style={styles.affiliateBtn} onPress={() => Linking.openURL(AD_URLS[winnerName] || AD_URLS.default)}>
<Text style={styles.affiliateBtnText}>🔥 {winnerName} で最大還元を受ける</Text>
</TouchableOpacity>
)}
<div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', padding: '0 10px' }}>
{cards.map((card) => {
const pt = calcPt(price, card.rate, card.limit);
const isWinner = pt === maxPt && pt > 0;
return (
<View key={card.id} style={{ ...styles.card, ...(isWinner ? styles.winnerCard : {}) }}>
<TextInput style={{ ...styles.cardName, color: isWinner ? '#000' : '#888' }} value={card.name} onChangeText={(v) => updateCard(card.id, 'name', v)} />
<View style={styles.inputArea}>
<View style={styles.inputBox}>
<Text style={{ ...styles.inputLabel, color: isWinner ? '#333' : '#555' }}>還元率%</Text>
<TextInput style={{ ...styles.cardInput, color: isWinner ? '#000' : '#fff' }} value={card.rate} onChangeText={(v) => updateCard(card.id, 'rate', v)} />
</View>
<View style={styles.inputBox}>
<Text style={{ ...styles.inputLabel, color: isWinner ? '#333' : '#555' }}>上限pt</Text>
<TextInput style={{ ...styles.cardInput, color: isWinner ? '#000' : '#fff' }} value={card.limit} onChangeText={(v) => updateCard(card.id, 'limit', v)} placeholder="∞" />
</View>
</View>
<View style={{ ...styles.resBox, backgroundColor: isWinner ? 'rgba(0,0,0,0.1)' : '#000' }}>
<Text style={{ ...styles.resPt, color: isWinner ? '#000' : '#CCFF00' }}>{Math.floor(pt).toLocaleString()}</Text>
<Text style={{ ...styles.resLabel, color: isWinner ? '#333' : '#666' }}>pt獲得</Text>
</View>
</View>
);
})}
</div>
<View style={styles.trustSection}>
<Text style={styles.articleTitle}>🤔 なぜ計算が必要なのか</Text>
<Text style={styles.articleText}>付与上限を超えると還元率は下がります。損をしないための比較ツールです。</Text>
<Text style={styles.trustText}>免責事項：本結果は保証されません。自己責任で利用してください。</Text>
</View>
</ScrollView>
</SafeAreaView>
);
}

const styles = {
container: { backgroundColor: '#000' },
fixedHeader: { padding: '15px', borderBottom: '1px solid #222', textAlign: 'center' },
headerTitle: { color: '#CCFF00', fontSize: '18px', fontWeight: '900' },
priceSection: { backgroundColor: '#111', padding: '25px', textAlign: 'center' },
label: { color: '#666', fontSize: '12px' },
priceInputWrapper: { display: 'flex', justifyContent: 'center', alignItems: 'baseline' },
priceInput: { color: '#fff', fontSize: '42px', fontWeight: '900', textAlign: 'center', width: '150px' },
yenText: { color: '#fff', fontSize: '20px' },
affiliateBtn: { backgroundColor: '#CCFF00', margin: '12px', padding: '18px', borderRadius: '15px', textAlign: 'center' },
affiliateBtnText: { color: '#000', fontWeight: '900' },
card: { width: '48%', backgroundColor: '#111', padding: '12px', borderRadius: '18px', marginBottom: '12px', border: '1px solid #222' },
winnerCard: { backgroundColor: '#CCFF00', borderColor: '#CCFF00' },
cardName: { fontSize: '15px', fontWeight: 'bold', textAlign: 'center', marginBottom: '12px' },
inputArea: { display: 'flex', justifyContent: 'space-between', marginBottom: '12px' },
inputBox: { width: '45%' },
inputLabel: { fontSize: '9px' },
cardInput: { fontSize: '18px', fontWeight: 'bold', borderBottom: '1px solid rgba(255,255,255,0.1)' },
resBox: { borderRadius: '12px', padding: '8px', textAlign: 'center' },
resPt: { fontSize: '26px', fontWeight: '900' },
resLabel: { fontSize: '10px' },
trustSection: { padding: '20px', color: '#999' },
articleTitle: { color: '#CCFF00', fontWeight: 'bold' },
articleText: { fontSize: '13px', margin: '10px 0' },
trustText: { fontSize: '10px' }
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
