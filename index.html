<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-checker Pro</title>
<style>
/* デザイン部分は変更なし：シンプルで使いやすく維持 */
:root { --main-green: #00b894; }
body { background-color: #ffffff; font-family: sans-serif; color: #000; margin: 0; padding: 10px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 900px; }
.header { font-size: 38px; font-weight: 900; text-align: center; margin-bottom: 2px; }
.sub-header { text-align: center; font-size: 11px; font-weight: 900; color: #666; margin-bottom: 10px; }
.live-counter { text-align: center; margin: 15px auto 25px; font-size: 14px; font-weight: 900; color: #000; background: #f0f0f0; padding: 12px; border-radius: 12px; border: 2px solid #000; display: block; max-width: 400px; }
.input-section { max-width: 500px; margin: 0 auto 25px; background: #f8f9fa; padding: 25px; border-radius: 25px; border: 3px solid #000; box-shadow: 10px 10px 0px #000; }
.price-input { background: transparent; border: none; border-bottom: 4px solid #000; color: #000; font-size: 48px; font-weight: 900; width: 100%; outline: none; text-align: center; }
.reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 40px; max-width: 550px; margin-left: auto; margin-right: auto; }
.reward-item { background: #fff; padding: 20px 15px; border-radius: 25px; border: 3px solid #000; text-align: center; position: relative; }
.reward-item.best { border-color: var(--main-green); background-color: #f0fff4; transform: scale(1.05); }
.name-input { width: 95%; border: none; border-bottom: 2px solid #333; font-size: 15px; font-weight: 900; text-align: center; margin-bottom: 15px; outline: none; }
.mini-input { background: #fff; border: 2px solid #000; border-radius: 10px; font-size: 16px; font-weight: 900; padding: 8px; text-align: center; width: 100%; box-sizing: border-box; }
.all-list-section { margin-top: 50px; border: 3px solid #000; border-radius: 30px; padding: 20px; background: #fff; }
.all-list-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
@media (max-width: 500px) { .all-list-grid { grid-template-columns: repeat(3, 1fr); } }
.list-card-name { font-size: 9px; font-weight: 900; border: 1px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; height: 40px; display: flex; align-items: center; justify-content: center; }
.legal-section { font-size: 11px; color: #444; border: 2px solid #000; padding: 20px; border-radius: 20px; margin-top: 50px; line-height: 1.6; }
</style>
</head>
<body>

<div class="container">
<div class="header">P-checker</div>
<div class="sub-header">MAX REWARD REALTIME DATABASE</div>

<div class="live-counter">
現段階サイト利用者 <span id="user-count">64</span> 名
</div>

<div class="input-section">
<input type="number" id="price" class="price-input" value="10000" oninput="updateAll(); triggerCountUp();">
</div>

<div class="reward-grid" id="grid"></div>

<div class="all-list-section">
<div class="all-list-grid" id="full-list-display"></div>
</div>

<div class="legal-section">
<h4>免責事項</h4>
<p>情報の正確性を保証しません。利用による損害について、管理者は一切の責任を負いません。</p>
</div>
</div>

<script>
// --- 【超重要】共有カウンターロジック修正 ---
// IDを新しくしました。これで3336リセットされます。
const SITE_ID = "pchecker_global_final_v1";
const BASE_START = 64;

// 現在の「世界共有カウント」を取得して表示する
async function syncCounter() {
try {
// CountAPIから現在の「プラス分」を取得
const res = await fetch(`https://api.countapi.xyz/get/pchecker/${SITE_ID}`);
const data = await res.json();

// 12時間ごとのランダム加算分（3~6名）を計算
const startDay = new Date('2025-02-01').getTime();
const hoursPassed = (Date.now() - startDay) / (1000 * 60 * 60);
const timeGrowth = Math.floor(hoursPassed / 12) * 4.5; // 平均4.5人増

const total = BASE_START + data.value + Math.floor(timeGrowth);
document.getElementById('user-count').innerText = total;
} catch (e) {
document.getElementById('user-count').innerText = BASE_START;
}
}

// 誰かが操作したら世界中でカウントを+1する
let hasActioned = false;
async function triggerCountUp() {
if (!hasActioned) {
hasActioned = true;
try {
// ここで実際にAPIに「+1」を記録させる
await fetch(`https://api.countapi.xyz/hit/pchecker/${SITE_ID}`);
syncCounter(); // 最新の数字に更新
} catch (e) {}
}
}

// --- 計算機ツール基本機能 ---
const db = {
"楽天カード": {r: 1.0, l: ""}, "三井住友(タッチ)": {r: 7.0, l: 1000}, "PayPayカード": {r: 1.0, l: ""},
"dカード": {r: 1.0, l: ""}, "au PAY カード": {r: 1.0, l: ""}, "Amazonプライム": {r: 2.0, l: ""}
};

function updateAll() {
const p = parseFloat(document.getElementById('price').value) || 0;
let results = [];
for (let i = 1; i <= 6; i++) {
const r = parseFloat(document.getElementById('rate' + i).value) || 0;
const res = Math.floor(p * (r / 100));
document.getElementById('val' + i).innerText = res.toLocaleString();
results.push({ index: i, val: res });
document.getElementById('item' + i).classList.remove('best');
}
const maxVal = Math.max(...results.map(r => r.val));
if (maxVal > 0) results.filter(r => r.val === maxVal).forEach(b => document.getElementById('item' + b.index).classList.add('best'));
}

const grid = document.getElementById('grid');
const keys = Object.keys(db);
for (let i = 1; i <= 6; i++) {
grid.innerHTML += `
<div class="reward-item" id="item${i}">
<input type="text" id="name${i}" class="name-input" value="${keys[i-1]}" oninput="updateAll(); triggerCountUp();">
<input type="number" id="rate${i}" class="mini-input" value="${db[keys[i-1]].r}" oninput="updateAll(); triggerCountUp();">
<div class="res-box"><div class="reward-amount"><span id="val${i}">0</span> pt</div></div>
</div>
`;
}

function renderList() {
const listDiv = document.getElementById('full-list-display');
keys.forEach(k => {
const card = document.createElement('div');
card.className = 'list-card-name'; card.innerText = k;
card.onclick = () => {
document.getElementById('name1').value = k;
document.getElementById('rate1').value = db[k].r;
updateAll(); triggerCountUp();
};
listDiv.appendChild(card);
});
}

// 起動
syncCounter();
renderList();
updateAll();
</script>
</body>
</html>
