<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-Checker Global Edition</title>
<style>
/* ガチ勢向けのダークモード・プロデザイン */
body {
background-color: #000;
font-family: 'Inter', -apple-system, sans-serif;
color: #fff;
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
}
.container { width: 100%; max-width: 400px; }

.header { color: #CCFF00; font-size: 36px; font-weight: 900; text-align: left; margin-bottom: 5px; }
.sub-header { color: #444; font-size: 12px; text-align: left; margin-bottom: 30px; letter-spacing: 1px; }

/* 入力セクション */
.input-section { margin-bottom: 40px; text-align: left; }
.label { color: #666; font-size: 12px; font-weight: bold; margin-bottom: 10px; display: block; }
.price-input {
background: transparent; border: none; border-bottom: 2px solid #222;
color: #fff; font-size: 56px; font-weight: 900; width: 100%; outline: none;
padding-bottom: 10px; transition: border-color 0.3s;
}
.price-input:focus { border-color: #CCFF00; }

/* 還元リスト */
.reward-list { display: flex; flex-direction: column; gap: 15px; }
.reward-item {
background: #111; padding: 20px; border-radius: 20px;
display: flex; justify-content: space-between; align-items: center;
border: 1px solid #1a1a1a;
}
.service-info { text-align: left; }
.service-name { font-size: 14px; font-weight: bold; color: #fff; }
.service-rate { font-size: 12px; color: #555; }
.reward-amount { font-size: 24px; font-weight: 900; color: #CCFF00; }
.unit { font-size: 12px; margin-left: 5px; color: #CCFF00; }

/* アクションボタン */
.action-group { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }
.btn {
padding: 20px; border-radius: 18px; font-weight: 800; text-decoration: none;
text-align: center; font-size: 16px; transition: 0.3s;
}
.btn-rakuten { background-color: #CCFF00; color: #000; } /* 収益ボタンを目立たせる */
.btn-smbc { border: 1px solid #333; color: #fff; }
.btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="container">
<div class="header">P-CALC</div>
<div class="sub-header">ULTIMATE REWARD TRACKER</div>

<div class="input-section">
<span class="label">PURCHASE AMOUNT</span>
<input type="number" id="price" class="price-input" value="10000" oninput="update()">
</div>

<div class="reward-list">
<div class="reward-item">
<div class="service-info">
<div class="service-name">Rakuten Card</div>
<div class="service-rate">Basic Reward 1.0%</div>
</div>
<div class="reward-amount"><span id="val-rakuten">100</span><span class="unit">円</span></div>
</div>

<div class="reward-item">
<div class="service-info">
<div class="service-name">SMBC Card (NL)</div>
<div class="service-rate">Touch Payment Max 7.0%</div>
</div>
<div class="reward-amount"><span id="val-smbc">700</span><span class="unit">円</span></div>
</div>

<div class="reward-item">
<div class="service-info">
<div class="service-name">Other Services</div>
<div class="service-rate">Standard 0.5%</div>
</div>
<div class="reward-amount"><span id="val-other">50</span><span class="unit">円</span></div>
</div>
</div>

<div class="action-group">
<a href="https://rpx.a8.net/svt/ejp?a8mat=4AXE4J+F171O2+2HOM+699KH&rakuten=y&a8ejpredirect=http%3A%2F%2Fhb.afl.rakuten.co.jp%2Fhgc%2F0ea62065.34400275.0ea62066.204f04c0%2Fa26021880808_4AXE4J_F171O2_2HOM_699KH%3Fpc%3Dhttp%253A%252F%252Fwww.rakuten.co.jp%252F%26m%3Dhttp%253A%252F%252Fm.rakuten.co.jp%252F"
target="_blank" class="btn btn-rakuten">RAKUTEN で貯める</a>

<a href="https://www.smbc-card.com/" target="_blank" class="btn btn-smbc">三井住友カード 詳細</a>
</div>
</div>

<script>
function update() {
const p = parseFloat(document.getElementById('price').value) || 0;

// 各還元率の計算
document.getElementById('val-rakuten').innerText = Math.floor(p * 0.01).toLocaleString();
document.getElementById('val-smbc').innerText = Math.floor(p * 0.07).toLocaleString();
document.getElementById('val-other').innerText = Math.floor(p * 0.005).toLocaleString();
}
// 初期実行
update();
</script>

</body>
</html>
