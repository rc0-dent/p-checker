<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-checker Pro</title>
<style>
:root { --main-green: #00b894; --accent-red: #d63031; }
body { background-color: #ffffff; font-family: sans-serif; color: #000; margin: 0; padding: 10px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 900px; }

/* ヘッダー */
.header { font-size: 38px; font-weight: 900; text-align: center; margin-bottom: 2px; }
.sub-header { text-align: center; font-size: 11px; font-weight: 900; color: #666; margin-bottom: 10px; }

/* 共有カウンター */
.live-counter { text-align: center; margin: 15px auto 25px; font-size: 14px; font-weight: 900; color: #000; background: #f0f0f0; padding: 12px; border-radius: 12px; border: 2px solid #000; display: block; max-width: 400px; }

/* 入力セクション */
.input-section { max-width: 500px; margin: 0 auto 25px; background: #f8f9fa; padding: 25px; border-radius: 25px; border: 3px solid #000; box-shadow: 10px 10px 0px #000; }
.label-main { font-size: 14px; font-weight: 900; margin-bottom: 10px; display: block; text-align: center; }
.price-input { background: transparent; border: none; border-bottom: 4px solid #000; color: #000; font-size: 48px; font-weight: 900; width: 100%; outline: none; text-align: center; }

/* 6つの比較枠グリッド */
.reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 40px; max-width: 600px; margin-left: auto; margin-right: auto; }
.reward-item { background: #fff; padding: 20px 15px; border-radius: 25px; border: 3px solid #000; text-align: center; position: relative; transition: 0.2s; }
.reward-item.best { border-color: var(--main-green); background-color: #f0fff4; transform: scale(1.05); box-shadow: 0 10px 30px rgba(0, 184, 148, 0.3); }

.name-input { width: 95%; border: none; border-bottom: 2px solid #333; font-size: 15px; font-weight: 900; text-align: center; margin-bottom: 15px; outline: none; background: transparent; }
.setting-header { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-top: 5px; height: 14px; }
.guide-text { color: var(--main-green); font-size: 9px; }
.mini-input { background: #fff; border: 2px solid #000; border-radius: 10px; font-size: 18px; font-weight: 900; padding: 8px; text-align: center; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; }

.res-box { margin-top: 10px; border-top: 2px solid #eee; padding-top: 15px; }
.reward-amount { font-size: 32px; font-weight: 900; }

/* 10列カタログ */
.all-list-section { margin-top: 50px; border: 3px solid #000; border-radius: 30px; padding: 25px; background: #fff; margin-bottom: 40px; }
.all-list-title { font-size: 18px; font-weight: 900; text-align: center; margin-bottom: 20px; background: #000; color: #fff; padding: 12px; border-radius: 15px; }
.all-list-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
@media (max-width: 850px) { .all-list-grid { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 500px) { .all-list-grid { grid-template-columns: repeat(3, 1fr); } }
.list-card-name { font-size: 9px; font-weight: 900; padding: 8px 2px; border: 1px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; background: #fafafa; display: flex; align-items: center; justify-content: center; height: 45px; line-height: 1.2; }
.list-card-name:hover { background: var(--main-green); color: #fff; }

.btn-rakuten { display: block; background-color: #bf0000; color: #fff; padding: 22px; border-radius: 20px; font-weight: 900; text-decoration: none; text-align: center; margin: 40px auto; max-width: 500px; font-size: 20px; box-shadow: 0 10px 0px #800000; }

.legal-section { font-size: 11px; color: #444; border: 2px solid #000; padding: 25px; border-radius: 25px; margin-bottom: 120px; background-color: #fcfcfc; line-height: 1.8; }
.legal-section h4 { text-align: center; font-size: 16px; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
</style>
</head>
<body>

<div class="container">
<div class="header">P-checker</div>
<div class="sub-header">MAX REWARD REALTIME DATABASE</div>

<div class="live-counter">現段階サイト利用者 <span id="user-count">64</span> 名</div>

<div class="input-section">
<span class="label-main">購入予定金額を入力 (¥)</span>
<input type="number" id="price" class="price-input" value="10000" oninput="updateAll(); triggerCountUp();">
</div>

<datalist id="service-list"></datalist>
<div class="reward-grid" id="grid"></div>

<a href="https://www.rakuten-card.co.jp/" target="_blank" class="btn-rakuten">楽天カード 公式サイトを確認</a>

<div class="all-list-section">
<div class="all-list-title">決済サービス一覧（全100社規模）</div>
<div class="all-list-grid" id="full-list-display"></div>
</div>

<div class="legal-section">
<h4>免責事項およびご利用上の注意</h4>
<p>1. 情報の正確性は保証しません。2. 計算結果は目安です。3. 利用による損害について、<b>管理者は一切の責任を負いません。</b></p>
</div>
</div>

<script>
// --- 共有カウンターロジック ---
const SITE_ID = "pchecker_mega_sync_v5";
const BASE_START = 64;

async function syncCounter() {
try {
const res = await fetch(`https://api.countapi.xyz/get/pchecker/${SITE_ID}`);
const data = await res.json();
const startDay = new Date('2025-02-01T00:00:00').getTime();
const diff12h = Math.floor((Date.now() - startDay) / (1000 * 60 * 60 * 12));
const total = BASE_START + (diff12h * 4) + data.value;
document.getElementById('user-count').innerText = total;
} catch (e) { document.getElementById('user-count').innerText = BASE_START; }
}

let hasActioned = false;
async function triggerCountUp() {
if (!hasActioned) {
hasActioned = true;
try {
await fetch(`https://api.countapi.xyz/hit/pchecker/${SITE_ID}`);
syncCounter();
} catch (e) {}
}
}

// --- データベース（主要会社抜粋） ---
const db = {
"楽天カード": {r: 1.0, l: ""}, "三井住友(タッチ)": {r: 7.0, l: 1000}, "PayPayカード": {r: 1.0, l: ""},
"dカード": {r: 1.0, l: ""}, "au PAY カード": {r: 1.0, l: ""}, "Amazonプライム": {r: 2.0, l: ""},
"リクルートカード": {r: 1.2, l: ""}, "JCB カード W": {r: 1.0, l: ""}, "イオンカード": {r: 0.5, l: ""},
"エポスゴールド": {r: 1.5, l: ""}, "セゾンパール": {r: 2.0, l: 3000}, "メルカード": {r: 1.0, l: ""},
"Olive(タッチ)": {r: 7.0, l: 1000}, "三菱UFJカード": {r: 0.5, l: ""}, "楽天ペイ": {r: 1.5, l: ""},
"PayPay(残高)": {r: 0.5, l: ""}, "d払い": {r: 0.5, l: ""}, "au PAY": {r: 0.5, l: ""}, "ファミペイ": {r: 0.5, l: ""},
"モバイルSuica": {r: 0.5, l: ""}, "Kyash": {r: 0.2, l: 100}, "楽天銀行デビット": {r: 1.0, l: ""}
// (ここに100社分追加可能)
};

// --- ツール機能 ---
function savePrefs() {
let names = [];
for(let i=1; i<=6; i++) names.push(document.getElementById('name' + i).value);
localStorage.setItem('p_prefs_final_fix', JSON.stringify(names));
}

const grid = document.getElementById('grid');
const initial = JSON.parse(localStorage.getItem('p_prefs_final_fix')) || ["楽天カード", "三井住友(タッチ)", "PayPayカード", "dカード", "au PAY カード", "Amazonプライム"];

for (let i = 1; i <= 6; i++) {
grid.innerHTML += `
<div class="reward-item" id="item${i}">
<input type="text" id="name${i}" class="name-input" list="service-list" value="${initial[i-1] || ''}" oninput="checkAndFill(${i})">
<div class="setting-header">還元率 % <span id="g-r${i}" class="guide-text"></span></div>
<input type="number" id="rate${i}" class="mini-input" step="0.1" oninput="updateAll(); triggerCountUp();">
<div class="setting-header">上限 pt <span id="g-l${i}" class="guide-text"></span></div>
<input type="number" id="limit${i}" class="mini-input" oninput="updateAll(); triggerCountUp();" placeholder="無">
<div class="res-box"><div class="reward-amount"><span id="val${i}">0</span> pt</div></div>
</div>
`;
}

function checkAndFill(idx) {
const name = document.getElementById('name' + idx).value;
const data = db[name];
if (data) {
document.getElementById('rate' + idx).value = data.r;
document.getElementById('limit' + idx).value = data.l;
document.getElementById('g-r' + idx).innerText = "※" + data.r + "%";
document.getElementById('g-l' + idx).innerText = data.l ? "上限:" + data.l : "";
} else {
document.getElementById('g-r' + idx).innerText = "";
document.getElementById('g-l' + idx).innerText = "";
}
savePrefs(); updateAll(); triggerCountUp();
}

function updateAll() {
const p = parseFloat(document.getElementById('price').value) || 0;
let results = [];
for (let i = 1; i <= 6; i++) {
const r = parseFloat(document.getElementById('rate' + i).value) || 0;
const l = document.getElementById('limit' + i).value === "" ? Infinity : parseFloat(document.getElementById('limit' + i).value);
const res = Math.floor(Math.min(p * (r / 100), l));
document.getElementById('val' + i).innerText = res.toLocaleString();
results.push({ index: i, val: res });
document.getElementById('item' + i).classList.remove('best');
}
const maxVal = Math.max(...results.map(r => r.val));
if (maxVal > 0) results.filter(r => r.val === maxVal).forEach(b => document.getElementById('item' + b.index).classList.add('best'));
}

function renderList() {
const listDiv = document.getElementById('full-list-display');
const datalist = document.getElementById('service-list');
Object.keys(db).forEach(k => {
const opt = document.createElement('option'); opt.value = k; datalist.appendChild(opt);
const card = document.createElement('div');
card.className = 'list-card-name'; card.innerText = k;
card.onclick = () => {
for(let i=1; i<=6; i++) {
if(!document.getElementById('name'+i).value || !db[document.getElementById('name'+i).value]) {
document.getElementById('name'+i).value = k; checkAndFill(i); return;
}
}
document.getElementById('name1').value = k; checkAndFill(1);
};
listDiv.appendChild(card);
});
}

syncCounter(); renderList();
for(let i=1; i<=6; i++) checkAndFill(i);
</script>
</body>
</html>
