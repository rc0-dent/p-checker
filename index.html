<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-Checker PRO</title>
<style>
/* 黒ベースのクールなデザイン */
body { flex: 1; background-color: #000; font-family: sans-serif; color: #fff; margin: 0; padding: 20px; text-align: center; }
.header { color: #CCFF00; fontSize: 32px; font-weight: 900; margin-bottom: 5px; }
.subHeader { color: #666; fontSize: 12px; margin-bottom: 20px; }

/* 金額入力メインカード */
.mainCard { background-color: #111; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #222; }
.label { color: #888; font-size: 10px; font-weight: bold; margin-bottom: 5px; display: block; }
input.priceInput { background: transparent; border: none; color: #fff; font-size: 40px; font-weight: 900; text-align: center; width: 100%; outline: none; }

/* 比較用カードの横並び */
.row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
.card { width: 48%; background-color: #111; padding: 15px; border-radius: 20px; border: 1px solid #222; box-sizing: border-box; }
.highlightCard { border-color: #CCFF00; }
.input-mini { background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; width: 100%; text-align: center; font-size: 18px; margin-bottom: 10px; outline: none; }

.resBox { margin-top: 10px; }
.resPt { font-size: 24px; font-weight: 900; display: block; }
.resLabel { color: #555; font-size: 10px; }

/* 判定結果カード */
.resultCard { background-color: #CCFF00; padding: 20px; border-radius: 25px; color: #000; margin-bottom: 20px; }
.verdictText { font-size: 20px; font-weight: 900; }

/* ボタングループ */
.btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn { padding: 15px; border-radius: 12px; font-weight: bold; text-decoration: none; display: block; color: #fff; font-size: 14px; }
.rakuten-btn { background-color: #bf0000; }
.smbc-btn { background-color: #00a040; }
</style>
</head>
<body>

<div class="header">P-Checker</div>
<div class="subHeader">〜ポイ活還元・逆転判定ツール〜</div>

<div class="mainCard">
<span class="label">買い物予定金額 (円)</span>
<input type="number" id="price" class="priceInput" value="10000" oninput="calculate()">
</div>

<div class="row">
<div class="card">
<span class="label">サービスA 還元率(%)</span>
<input type="number" id="rateA" class="input-mini" value="0.5" oninput="calculate()">
<span class="label">上限 (pt)</span>
<input type="number" id="limitA" class="input-mini" placeholder="無制限" oninput="calculate()">
<div class="resBox">
<span class="resPt" id="resA">50 pt</span>
<span class="resLabel">獲得予定</span>
</div>
</div>

<div class="card highlightCard">
<span class="label" style="color:#CCFF00">サービスB 還元率(%)</span>
<input type="number" id="rateB" class="input-mini" style="color:#CCFF00" value="5.0" oninput="calculate()">
<span class="label">上限 (pt)</span>
<input type="number" id="limitB" class="input-mini" value="500" oninput="calculate()">
<div class="resBox">
<span class="resPt" style="color:#CCFF00" id="resB">500 pt</span>
<span class="resLabel">獲得予定</span>
</div>
</div>
</div>

<div class="resultCard">
<div id="verdict" class="verdictText">「450円」の差で B の勝ち！</div>
</div>

<div class="btn-group">
<a href="https://rpx.a8.net/svt/ejp?a8mat=4AXE4J+F171O2+2HOM+699KH&rakuten=y&a8ejpredirect=http%3A%2F%2Fhb.afl.rakuten.co.jp%2Fhgc%2F0ea62065.34400275.0ea62066.204f04c0%2Fa26021880808_4AXE4J_F171O2_2HOM_699KH%3Fpc%3Dhttp%253A%252F%252Fwww.rakuten.co.jp%252F%26m%3Dhttp%253A%252F%252Fm.rakuten.co.jp%252F"
target="_blank" class="btn rakuten-btn">楽天でポイ活を開始する</a>

<a href="https://www.smbc-card.com/" target="_blank" class="btn smbc-btn">三井住友カード(NL)をチェック</a>
</div>

<script>
function calculate() {
const p = parseFloat(document.getElementById('price').value) || 0;

function getResult(rateId, limitId) {
const r = parseFloat(document.getElementById(rateId).value) || 0;
const l = parseFloat(document.getElementById(limitId).value) || Infinity;
return Math.min(p * (r / 100), l);
}

const resA = getResult('rateA', 'limitA');
const resB = getResult('rateB', 'limitB');

document.getElementById('resA').innerText = Math.floor(resA) + ' pt';
document.getElementById('resB').innerText = Math.floor(resB) + ' pt';

const verdict = document.getElementById('verdict');
if (resA === resB) {
verdict.innerText = "どちらも同じです";
} else if (resA > resB) {
verdict.innerText = `「${Math.floor(resA - resB)}円」の差で A の勝ち！`;
} else {
verdict.innerText = `「${Math.floor(resB - resA)}円」の差で B の勝ち！`;
}
}
</script>

</body>
</html>
